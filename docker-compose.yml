services:
  reservar-db:
    image: postgres:16
    container_name: reservar_db
    environment:
      POSTGRES_DB: reservar_db
      POSTGRES_USER: reservar_user
      POSTGRES_PASSWORD: 123456789
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U reservar_user -d reservar_db" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - reservar-db:/var/lib/postgresql/data
    networks:
      - reservar
    ports:
      - "5433:5432"
  reservar-app:
    build:
      context: ./back-reservAr
      dockerfile: Dockerfile
    container_name: reservar_app
    restart: on-failure
    depends_on:
      reservar-db:
        condition: service_healthy
    networks:
      - reservar
    ports:
      - "8080:8080"

volumes:
  reservar-db:

networks:
  reservar: